{% extends 'base.html' %}

{% block title %}运行评估 - RAGForge{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">运行评估</h1>

    <div class="bg-white rounded-lg shadow p-6">
        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">选择评估数据集</label>
                <select name="dataset_id" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    {% for ds in datasets %}
                    <option value="{{ ds.id }}">{{ ds.name }} ({{ ds.question_count }} 问题)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">检索策略</label>
                <select name="retrieval_type" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="dense">稠密检索 (向量)</option>
                    <option value="bm25">BM25 (关键词)</option>
                    <option value="hybrid">混合检索 (向量+关键词)</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Top K</label>
                <select name="top_k" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                    <option value="3">Top 3</option>
                    <option value="5" selected>Top 5</option>
                    <option value="10">Top 10</option>
                </select>
            </div>

            <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700">
                开始评估
            </button>
        </form>
    </div>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6">
        <h3 class="font-medium text-blue-900 mb-2">评估会计算什么指标：</h3>
        <ul class="text-sm text-blue-800 space-y-1 list-disc list-inside">
            <li><strong>Recall@K</strong>：前 K 条结果里有没有找到正确答案</li>
            <li><strong>MRR</strong>：第一个正确答案排第几名</li>
            <li><strong>nDCG@K</strong>：排序质量综合评分</li>
        </ul>
    </div>
</div>
{% endblock %}
