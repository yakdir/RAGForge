{% extends 'base.html' %}

{% block title %}登录 - RAGForge{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">RAGForge 登录</h1>

    <div class="bg-white rounded-lg shadow p-6">
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">邮箱</label>
                <input type="email" name="email" class="w-full border border-gray-300 rounded-lg px-3 py-2" required>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" name="password" class="w-full border border-gray-300 rounded-lg px-3 py-2" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
                登录
            </button>
        </form>
    </div>
</div>
{% endblock %}
